/* Layout: one calm column. Hero with a hub-and-ring drawing, then the Hub demo, nine departments and the promises we keep. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --fg: #0E1B2B;
  --muted: #53627A;
  --line: #CDD5DF;
  --accent: #0A6B6B;
  --accent-ink: #FFFFFF;
  --signal: #B87410;
  --ok: #1B7A45;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Readex Pro", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A121C; --surface: #111C2A; --fg: #E5ECF3; --muted: #93A3B8; --line: #25344A;
    --accent: #4FC3B5; --accent-ink: #06201D; --signal: #E3A646; --ok: #5CC98B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A121C; --surface: #111C2A; --fg: #E5ECF3; --muted: #93A3B8; --line: #25344A;
  --accent: #4FC3B5; --accent-ink: #06201D; --signal: #E3A646; --ok: #5CC98B; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 880px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-size: 14px; }

.hero { display: grid; gap: 24px; padding-block: 16px 40px; align-items: center; }
@media (min-width: 720px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero h1 { font-size: clamp(30px, 7vw, 48px); font-weight: 700; }
.hero p.lead { color: var(--muted); font-size: 17px; margin-top: 14px; max-width: 52ch; }
.target { margin-top: 22px; display: inline-flex; flex-direction: column; gap: 2px; border-inline-start: 3px solid var(--signal); padding-inline-start: 14px; }
.target b { font-family: var(--font-data); font-size: 28px; font-weight: 500; }
.target span { color: var(--muted); font-size: 14px; max-width: 40ch; }
.ring { width: 100%; max-width: 360px; margin-inline: auto; }
.ring circle.node { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.ring circle.core { fill: var(--accent); }
.ring line, .ring circle.orbit { stroke: var(--line); fill: none; stroke-width: 1.5; }
.ring text { fill: var(--accent-ink); font-family: var(--font-data); font-size: 13px; text-anchor: middle; }
.ring text.n { fill: var(--fg); font-size: 11px; }

section { padding-block: 32px; border-top: 1px solid var(--line); }
section > h2 { font-size: clamp(22px, 5vw, 30px); }
section > p.sub { color: var(--muted); margin-top: 8px; max-width: 60ch; }

.hub { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 14px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.hubform { display: flex; gap: 8px; flex-wrap: wrap; }
.hubform input { flex: 1 1 220px; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 20px; font-weight: 600; }
ol.plan { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 0; }
ol.plan li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; padding-block: 12px; border-top: 1px solid var(--line); }
ol.plan li:first-child { border-top: 0; }
.tag { font-family: var(--font-data); font-size: 12px; border-radius: 4px; padding: 2px 8px; white-space: nowrap; border: 1px solid currentColor; }
.tag.auto { color: var(--ok); }
.tag.approve { color: var(--signal); }
.tag.expert { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin-top: 12px; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-family: var(--font-display); font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary .idx { font-family: var(--font-data); color: var(--accent); font-weight: 500; min-width: 2ch; }
summary::after { content: "+"; margin-inline-start: auto; font-family: var(--font-data); color: var(--muted); }
details[open] summary::after { content: "−"; }
details ul { margin: 0; padding: 0 16px 16px; padding-inline-start: 44px; color: var(--muted); display: grid; gap: 4px; }
details .why { padding: 0 16px 8px; padding-inline-start: 44px; font-size: 14px; color: var(--fg); }

.row { display: grid; gap: 6px; }
.row .top { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.row .top b { font-family: var(--font-data); font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.out { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.out div { border-top: 2px solid var(--line); padding-top: 8px; }
.out b { display: block; font-family: var(--font-data); font-size: 22px; font-weight: 500; }
.out span { font-size: 13px; color: var(--muted); }
.bar { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--signal); width: 0; transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }


.promises { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.promises li { padding-inline-start: 16px; border-inline-start: 2px solid var(--accent); }
footer { padding-top: 28px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

.nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: var(--fg); text-decoration: none; font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
.nav a:hover { border-color: var(--accent); }
a.cta { display: inline-block; margin-top: 22px; text-decoration: none; }
.steps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--font-data); color: var(--accent); font-size: 20px; }
.steps h3 { font-size: 17px; }
.steps p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.plans { margin-top: 18px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 420px)); }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.plan-card.main { border-color: var(--accent); border-width: 2px; }
.plan-card h3 { font-size: 18px; }
.plan-card .price { font-family: var(--font-data); font-size: 30px; font-weight: 500; }
.plan-card .price small { font-size: 14px; color: var(--muted); }
.trial { align-self: flex-start; font-family: var(--font-data); font-size: 12px; color: var(--ok); border: 1px solid currentColor; border-radius: 4px; padding: 2px 8px; }
.plan-card p { color: var(--muted); font-size: 15px; }
.plan-card ul { margin: 0; padding: 0; padding-inline-start: 18px; display: grid; gap: 4px; font-size: 15px; }
.contact { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.contact .num { font-family: var(--font-data); font-size: 20px; direction: ltr; unicode-bidi: isolate; user-select: all; }
a.go { text-decoration: none; display: inline-block; }
</style>

var lang = "ar";
try { lang = localStorage.getItem("orv-lang") || "ar"; } catch (e) {}
var planKey = "gen", goalText = "";
var $ = function (id) { return document.getElementById(id); };
function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }

function drawRing() {
  var s = $("ring"), h = "", cx = 160, cy = 160, r = 112, i, a, x, y;
  h += '<circle class="orbit" cx="160" cy="160" r="112"/>';
  for (i = 0; i < 9; i++) {
    a = (Math.PI * 2 * i) / 9 - Math.PI / 2;
    x = cx + r * Math.cos(a); y = cy + r * Math.sin(a);
    h += '<line x1="160" y1="160" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
  }
  for (i = 0; i < 9; i++) {
    a = (Math.PI * 2 * i) / 9 - Math.PI / 2;
    x = cx + r * Math.cos(a); y = cy + r * Math.sin(a);
    h += '<circle class="node" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="17"/>';
    h += '<text class="n" x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '">' + (i + 1) + '</text>';
  }
  h += '<circle class="core" cx="160" cy="160" r="38"/><text x="160" y="165">HUB</text>';
  s.innerHTML = h;
}

function renderPlan() {
  var t = L[lang], steps = t.plans[planKey], tags = { a: ["auto", t.aTag], p: ["approve", t.pTag], e: ["expert", t.eTag] };
  var h = "", i, st;
  for (i = 0; i < steps.length; i++) {
    st = steps[i];
    h += '<li><span>' + (i + 1) + '. ' + st[0] + '</span><span class="tag ' + tags[st[1]][0] + '">' + tags[st[1]][1] + '</span></li>';
  }
  $("plan").innerHTML = h;
}

function renderDepts() {
  var t = L[lang], h = "", i, d, j;
  for (i = 0; i < t.depts.length; i++) {
    d = t.depts[i];
    h += '<details' + (i === 0 ? ' open' : '') + '><summary><span class="idx">' + (i + 1) + '</span>' + d[0] + '</summary><p class="why">' + d[1] + '</p><ul>';
    for (j = 0; j < d[2].length; j++) h += '<li>' + d[2][j] + '</li>';
    h += '</ul></details>';
  }
  $("deptList").innerHTML = h;
}

function renderStatic() {
  var t = L[lang], h = "", i;
  var h2 = "";
  for (i = 0; i < t.rules.length; i++) h += '<li>' + t.rules[i] + '</li>';
  $("rulesList").innerHTML = h;
  h = "";
  for (i = 0; i < t.chips.length; i++) h += '<button type="button" class="chip" data-k="' + (i === 0 ? "skin" : "food") + '">' + t.chips[i] + '</button>';
  $("chips").innerHTML = h;
  h = "";
  for (i = 0; i < t.nav.length; i++) h += '<a href="' + t.nav[i][0] + '">' + t.nav[i][1] + '</a>';
  $("nav").innerHTML = h;
  h = "";
  for (i = 0; i < t.how.length; i++) h += '<li><div><h3>' + t.how[i][0] + '</h3><p>' + t.how[i][1] + '</p></div></li>';
  $("howList").innerHTML = h;
  h = "";
  var pr, k, f;
  for (i = 0; i < t.pricing.length; i++) {
    pr = t.pricing[i]; f = "";
    for (k = 0; k < pr[4].length; k++) f += '<li>' + pr[4][k] + '</li>';
    h += '<div class="plan-card' + (pr[6] ? ' main' : '') + '"><h3>' + pr[0] + '</h3><div class="price">' + (pr[1] === "—" ? "—" : "$" + pr[1]) + (pr[2] ? ' <small>' + pr[2] + '</small>' : '') + '</div><div class="trial">' + t.trial + '</div><p>' + pr[3] + '</p><ul>' + f + '</ul></div>';
  }
  $("planList").innerHTML = h;
  h = "";
  for (i = 0; i < t.faq.length; i++) h += '<details><summary>' + t.faq[i][0] + '</summary><p class="why">' + t.faq[i][1] + '</p></details>';
  $("faqList").innerHTML = h;
}

function applyLang() {
  var t = L[lang], els = document.querySelectorAll("[data-i]"), i;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  for (i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute("data-i")];
  $("goal").placeholder = t.ph;
  $("langBtn").textContent = lang === "ar" ? "EN" : "عربي";
  renderStatic(); renderDepts(); renderPlan();
}

$("langBtn").addEventListener("click", function () {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("orv-lang", lang); } catch (e) {}
  applyLang();
});
$("chips").addEventListener("click", function (e) {
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if (!k) return;
  planKey = k; $("goal").value = e.target.textContent; renderPlan();
});
$("hubForm").addEventListener("submit", function (e) {
  e.preventDefault();
  planKey = "gen"; renderPlan();
});

});
